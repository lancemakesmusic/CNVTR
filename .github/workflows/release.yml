# Build self-contained installers and publish to GitHub Releases when you push a version tag.
#
# How to ship a build others can download:
#   1. Commit and push your main branch.
#   2. git tag v1.0.0 && git push origin v1.0.0
#   3. Open the repo on GitHub → Releases → the new tag has .exe + .dmg attached.
#
# Manual run (Actions → Release): still produces workflow artifacts, but does NOT create a
# GitHub Release unless the run was triggered by a tag push.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bundle yt-dlp and FFmpeg (Windows)
        shell: pwsh
        run: ./scripts/ci-bundle-binaries.ps1

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: npm test && npm run lint

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: cnvtr-windows
          path: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bundle yt-dlp and FFmpeg (macOS)
        run: chmod +x scripts/ci-bundle-binaries.sh && ./scripts/ci-bundle-binaries.sh

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: npm test && npm run lint

      - name: Build macOS installer
        run: npm run build:mac

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: cnvtr-macos
          path: release/*.dmg

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-mac]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: cnvtr-windows
          path: artifacts/win

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: cnvtr-macos
          path: artifacts/mac

      - name: Create GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CNVTR ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/win/*.exe
            artifacts/mac/*.dmg
