# Build all-in-one installers (yt-dlp + FFmpeg via npm) and publish to GitHub Releases on tag v*.
#
# Public download link after publish: https://github.com/<you>/CNVTR/releases/latest
#
# Trigger: push tag v1.0.3  OR  Actions → Release → Run workflow (artifacts only; no Release unless tag push).
name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bundle yt-dlp for packager
        run: npm run bundle:deps

      - name: Test and lint
        run: npm test && npm run lint

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: cnvtr-windows
          path: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bundle yt-dlp for packager
        run: npm run bundle:deps

      - name: Test and lint
        run: npm test && npm run lint

      - name: Build macOS installer
        run: npm run build:mac

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: cnvtr-macos
          path: release/*.dmg

  publish-release:
    needs: [build-windows, build-mac]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cnvtr-windows
          path: win

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: cnvtr-macos
          path: mac

      - name: Create GitHub Release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CNVTR ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            win/*.exe
            mac/*.dmg
