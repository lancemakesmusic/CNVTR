name: CI

# Use Node 24 for @actions/* JavaScript (GitHub is deprecating the Node 20 action runtime).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Block only on critical production issues; devDependency advisories are common on Electron stacks.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=critical
